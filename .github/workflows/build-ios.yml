name: Build and Release Nuvio iOS IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or Tag from NuvioMobile to build'
        required: true
        default: 'cmp-rewrite'
      configuration:
        description: 'Build Configuration'
        required: true
        type: choice
        options:
          - Release
          - Debug
        default: 'Release'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release iOS IPA
    runs-on: macos-14
    timeout-minutes: 90

    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: ${{ inputs.configuration }}
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M

    steps:
      # 1. Check out NuvioMobile
      - name: Checkout NuvioMobile Repository
        uses: actions/checkout@v4
        with:
          repository: NuvioMedia/NuvioMobile
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      # 2. Select Xcode 16 (Required for Project Format 77)
      - name: Select Xcode 16
        run: |
          XCODE_16=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Switching to $XCODE_16"
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
            echo "DEVELOPER_DIR=$XCODE_16/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version

      # 3. Extract exact version and build number
      - name: Extract App Version & Metadata
        id: meta
        run: |
          VERSION_FILE="iosApp/Configuration/Version.xcconfig"
          APP_VERSION=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*(.+)/\1/p' "$VERSION_FILE" | tr -d '\r' | head -n 1)
          BUILD_NUMBER=$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*(.+)/\1/p' "$VERSION_FILE" | tr -d '\r' | head -n 1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building Nuvio version ${APP_VERSION} (Build ${BUILD_NUMBER}) [${SHORT_SHA}]"

      # 4. Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Gradle Cache
      - name: Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 6. Cache Kotlin/Native Toolchain
      - name: Cache Kotlin Native Toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      # 7. Cache NuvioEngine Framework
      - name: Cache NuvioEngine Framework
        uses: actions/cache@v4
        with:
          path: ../nuvio-engine
          key: nuvio-engine-${{ runner.os }}-${{ hashFiles('scripts/prepare-ios-dependencies.sh') }}
          restore-keys: |
            nuvio-engine-${{ runner.os }}-

      # 8. Cache SwiftPM Dependencies
      - name: Cache SwiftPM Dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj', 'MPVKit/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      # 9. Prepare iOS Dependencies
      - name: Prepare Scripts & Dependencies
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/*.sh
          ./scripts/prepare-ios-dependencies.sh

      # 10. Patch Widget Extension Swift Compatibility (Fixes Xcode 16 Swift compilation)
      - name: Patch Widget Extension Swift Compatibility
        run: |
          cat << 'EOF' > iosApp/DownloadsWidgetExtension/DownloadsWidgetBundle.swift
          import WidgetKit
          import SwiftUI

          @main
          struct DownloadsWidgetBundle: WidgetBundle {
              @WidgetBundleBuilder
              var body: some Widget {
                  if #available(iOSApplicationExtension 16.1, *) {
                      DownloadsLiveActivityWidget()
                  }
              }
          }
          EOF

          # Ensure DownloadsLiveActivityAttributes has @available for ActivityKit
          sed -i '' 's/^struct DownloadsLiveActivityAttributes: ActivityAttributes/@available(iOSApplicationExtension 16.1, *)\nstruct DownloadsLiveActivityAttributes: ActivityAttributes/' iosApp/DownloadsWidgetExtension/DownloadsLiveActivityWidget.swift

      # 11. Build Unsigned IPA
      - name: Build Unsigned IPA
        run: |
          ./scripts/build-ios-ipa.sh

      # 11. Locate Generated IPA
      - name: Locate Generated IPA
        id: ipa_info
        run: |
          IPA_PATH=$(find build/ios-ipa -type f -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA file found in build/ios-ipa/"
            exit 1
          fi
          IPA_NAME=$(basename "$IPA_PATH")
          IPA_SIZE=$(du -h "$IPA_PATH" | cut -f1)
          echo "path=${IPA_PATH}" >> "$GITHUB_OUTPUT"
          echo "filename=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "size=${IPA_SIZE}" >> "$GITHUB_OUTPUT"
          echo "Created IPA: ${IPA_NAME} (${IPA_SIZE})"

      # 12. Upload to GitHub Artifacts (Backup)
      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa_info.outputs.filename }}
          path: ${{ steps.ipa_info.outputs.path }}
          retention-days: 7

      # 13. Publish to GitHub Releases
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.meta.outputs.version }}-${{ inputs.configuration }}"
          name: "Nuvio v${{ steps.meta.outputs.version }} (${{ inputs.configuration }} - Build ${{ steps.meta.outputs.build_number }})"
          body: |
            ## Nuvio iOS Unsigned IPA

            - **App Name:** Nuvio
            - **Version:** `${{ steps.meta.outputs.version }}`
            - **Build Number:** `${{ steps.meta.outputs.build_number }}`
            - **Configuration:** `${{ inputs.configuration }}`
            - **Upstream Commit:** `${{ steps.meta.outputs.short_sha }}`
            - **Filename:** `${{ steps.ipa_info.outputs.filename }}`
            - **Size:** `${{ steps.ipa_info.outputs.size }}`

            ---
            ### 📲 How to Sideload:
            1. Download the `.ipa` asset attached below.
            2. Sign and install using **SideStore**, **AltStore**, **Sideloadly**, or **TrollStore**.
          files: ${{ steps.ipa_info.outputs.path }}
          draft: false
          prerelease: ${{ inputs.configuration == 'Debug' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}