name: Build and Release Nuvio iOS IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or Tag from NuvioMobile to build'
        required: true
        default: 'cmp-rewrite'
      configuration:
        description: 'Build Configuration'
        required: true
        type: choice
        options:
          - Release
          - Debug
        default: 'Release'

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 90

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: ${{ inputs.configuration }}
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: NuvioMedia/NuvioMobile
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Extract App Version & Metadata
        id: meta
        run: |
          VERSION_FILE="iosApp/Configuration/Version.xcconfig"
          APP_VERSION=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*(.+)/\1/p' "$VERSION_FILE" | tr -d '\r' | head -n 1)
          BUILD_NUMBER=$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*(.+)/\1/p' "$VERSION_FILE" | tr -d '\r' | head -n 1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building Nuvio version ${APP_VERSION} (Build ${BUILD_NUMBER}) [${SHORT_SHA}]"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare iOS dependencies
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/*.sh
          ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned full ${{ inputs.configuration }} IPA
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          ./scripts/build-ios-ipa.sh

      - name: Locate Generated IPA
        id: ipa_info
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name "*-full-${configuration_slug}.ipa" -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "::error::No IPA file found in build/ios-ipa/"
            exit 1
          fi
          ipa_name="$(basename "${ipa_path}")"
          ipa_size="$(du -h "${ipa_path}" | cut -f1)"
          
          echo "path=${ipa_path}" >> "$GITHUB_OUTPUT"
          echo "filename=${ipa_name}" >> "$GITHUB_OUTPUT"
          echo "size=${ipa_size}" >> "$GITHUB_OUTPUT"
          echo "Created IPA: ${ipa_name} (${ipa_size})"

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa_info.outputs.filename }}
          path: ${{ steps.ipa_info.outputs.path }}
          retention-days: 7

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.meta.outputs.version }}-${{ inputs.configuration }}"
          name: "Nuvio v${{ steps.meta.outputs.version }} (${{ inputs.configuration }} - Build ${{ steps.meta.outputs.build_number }})"
          body: |
            ## Nuvio iOS Unsigned IPA

            - **App Name:** Nuvio
            - **Version:** `${{ steps.meta.outputs.version }}`
            - **Build Number:** `${{ steps.meta.outputs.build_number }}`
            - **Configuration:** `${{ inputs.configuration }}`
            - **Upstream Commit:** `${{ steps.meta.outputs.short_sha }}`
            - **Filename:** `${{ steps.ipa_info.outputs.filename }}`
            - **Size:** `${{ steps.ipa_info.outputs.size }}`

            ---
            ### 📲 How to Sideload:
            1. Download the `.ipa` asset attached below.
            2. Sign and install using **SideStore**, **AltStore**, **Sideloadly**, or **TrollStore**.
          files: ${{ steps.ipa_info.outputs.path }}
          draft: false
          prerelease: ${{ inputs.configuration == 'Debug' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}